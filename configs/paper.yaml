common:
  filling: 0.8
  temperature: 0.0

numerics:
  field_tolerance: 1.0e-10
  density_tolerance: 1.0e-10
  density_imaginary_tolerance: 1.0e-10
  number_tolerance: 1.0e-9
  max_scf_iterations: 5000
  max_mu_iterations: 42
  mixing: 0.30
  minimum_branch_overlap: 0.70
  projector_idempotency_tolerance: 1.0e-8
